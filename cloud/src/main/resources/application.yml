server:
  port: 8086

spring:
  application:
    name: teli-cloud-sync-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/teli_cloud_sync;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

logging:
  level:
    com.teli.attendance: DEBUG
    org.springframework.web: INFO
