# ─── Production application configuration ─────────────────────────────────────
# Active when: SPRING_PROFILES_ACTIVE=prod  (set in docker-compose.yml)

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:attendance}
    username: ${DB_USER:teli}
    password: ${DB_PASS:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate        # NEVER use create/update in production
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  # Disable H2 console in production
  h2:
    console:
      enabled: false

server:
  port: ${SERVER_PORT:8086}
  compression:
    enabled: true
    mime-types: application/json,text/plain
    min-response-size: 1024
  error:
    include-message: never     # don't leak stack traces to clients
    include-stacktrace: never

# Actuator — health check only exposed
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Logging
logging:
  level:
    root: WARN
    com.teli.attendance: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
